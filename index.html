<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>thatgamejam #02 · 项目看板（离线版）</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
  font-size: 13px; color: #1f2329; background: #f3f5f8; overflow: hidden;
}
.app { display: flex; height: 100vh; }

/* ---------- 左侧导航 ---------- */
.side {
  width: 200px; flex: 0 0 200px; background: #fff;
  border-right: 1px solid #e5e6eb; display: flex; flex-direction: column;
}
.side .logo {
  height: 52px; display: flex; align-items: center; gap: 9px;
  padding: 0 16px; border-bottom: 1px solid #e5e6eb;
}
.side .logo .mark {
  width: 22px; height: 22px; border-radius: 5px; background: #3370ff;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 11px; font-weight: 600;
}
.side .logo .pn { font-size: 13px; font-weight: 600; }
.side .logo .sub { font-size: 11px; color: #8f959e; margin-top: 1px; }
.side .grp { padding: 12px 8px 4px; font-size: 11px; color: #8f959e; padding-left: 18px; }
.side .item {
  display: flex; align-items: center; gap: 8px; padding: 7px 18px;
  cursor: pointer; color: #4e5969; border-left: 2px solid transparent;
}
.side .item:hover { background: #f5f7fa; }
.side .item.on { background: #eaf1ff; color: #3370ff; border-left-color: #3370ff; font-weight: 500; }
.side .item .cnt { margin-left: auto; font-size: 11px; color: #8f959e; }
.side .dot { width: 6px; height: 6px; border-radius: 50%; }
.side .foot { margin-top: auto; padding: 12px 18px; font-size: 11px; color: #a9aeb8; border-top: 1px solid #e5e6eb; }

/* ---------- 主区 ---------- */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.topbar {
  height: 52px; flex: 0 0 52px; background: #fff; border-bottom: 1px solid #e5e6eb;
  display: flex; align-items: center; padding: 0 20px; gap: 14px;
}
.topbar h1 { font-size: 15px; font-weight: 600; }
.topbar .crumb { font-size: 12px; color: #8f959e; }
.topbar .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.btn {
  border: 1px solid #d0d3d9; background: #fff; color: #4e5969;
  padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;
  font-family: inherit;
}
.btn:hover { border-color: #3370ff; color: #3370ff; }
.btn.pri { background: #3370ff; border-color: #3370ff; color: #fff; }
.btn.pri:hover { background: #245bdb; color: #fff; }

.content { flex: 1; overflow: auto; padding: 16px 20px 24px; }

/* ---------- 统计卡 ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 14px; }
.card {
  background: #fff; border: 1px solid #e5e6eb; border-radius: 6px; padding: 12px 14px;
}
.card .k { font-size: 11px; color: #8f959e; }
.card .v { font-size: 21px; font-weight: 600; margin-top: 3px; line-height: 1.2; }
.card .v small { font-size: 12px; font-weight: 400; color: #8f959e; }
.card.warn .v { color: #f54a45; }
.card.ok .v { color: #00a870; }

/* ---------- 工具条 ---------- */
.toolbar {
  background: #fff; border: 1px solid #e5e6eb; border-radius: 6px;
  padding: 9px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px;
}
.toolbar label { font-size: 12px; color: #8f959e; }
select, input[type=text] {
  border: 1px solid #d0d3d9; border-radius: 4px; padding: 4px 7px;
  font-size: 12px; font-family: inherit; color: #1f2329; background: #fff; outline: none;
}
select:focus, input[type=text]:focus { border-color: #3370ff; }
input[type=text] { width: 150px; }
.seg { display: flex; border: 1px solid #d0d3d9; border-radius: 4px; overflow: hidden; }
.seg button {
  border: 0; background: #fff; padding: 4px 10px; font-size: 12px; cursor: pointer;
  color: #4e5969; font-family: inherit; border-right: 1px solid #d0d3d9;
}
.seg button:last-child { border-right: 0; }
.seg button.on { background: #3370ff; color: #fff; }
.spacer { margin-left: auto; }

/* ---------- 表格 ---------- */
.tw { background: #fff; border: 1px solid #e5e6eb; border-radius: 6px; overflow: hidden; }
table { width: 100%; border-collapse: collapse; }
thead th {
  background: #f7f8fa; text-align: left; font-size: 12px; font-weight: 500; color: #8f959e;
  padding: 8px 10px; border-bottom: 1px solid #e5e6eb; white-space: nowrap; position: sticky; top: 0; z-index: 2;
}
tbody td { padding: 7px 10px; border-bottom: 1px solid #f0f1f3; vertical-align: middle; }
tbody tr:hover { background: #f7f9ff; }
tbody tr.done { opacity: .5; }
td.id { font-family: Consolas, monospace; font-size: 12px; color: #3370ff; cursor: pointer; white-space: nowrap; }
td.title { min-width: 230px; }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.gh {
  padding: 7px 10px; background: #f0f4ff; font-size: 12px; font-weight: 600; color: #245bdb;
  border-bottom: 1px solid #e5e6eb; display: flex; gap: 8px; align-items: center;
}
.gh .n { font-weight: 400; color: #8f959e; }

/* ---------- 标签 ---------- */
.tag {
  display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 11px;
  line-height: 17px; white-space: nowrap;
}
.p0 { background: #fdeceb; color: #d54941; }
.p1 { background: #fff3e5; color: #d97706; }
.p2 { background: #f2f3f5; color: #8f959e; }
.ep { background: #eaf1ff; color: #245bdb; }
.gy { background: #eaf7f0; color: #0a7a4b; }
.gp { background: #fff8e6; color: #a3651a; }
.gn { background: #f2f3f5; color: #6b7075; }
.st { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; font-size: 12px; }
.st .d { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 7px; }
.s0 .d { background: #c9cdd4; } .s1 .d { background: #3370ff; }
.s2 .d { background: #ff8800; } .s3 .d { background: #9254de; } .s4 .d { background: #00a870; }
.s4 { color: #00a870; }
.av {
  width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center;
  justify-content: center; font-size: 10px; color: #fff; margin-right: 5px; vertical-align: middle;
}
.r0 { background: #3370ff; } .r1 { background: #9254de; } .r2 { background: #00a870; }
.r3 { background: #ff8800; } .r4 { background: #4e5969; }

/* ---------- 看板 ---------- */
.board { display: grid; grid-template-columns: repeat(5, minmax(190px, 1fr)); gap: 10px; align-items: start; }
.col { background: #fff; border: 1px solid #e5e6eb; border-radius: 6px; display: flex; flex-direction: column; }
.col .ch {
  padding: 9px 12px; border-bottom: 1px solid #e5e6eb; font-size: 12px; font-weight: 600;
  display: flex; align-items: center; gap: 6px;
}
.col .ch .n { margin-left: auto; font-weight: 400; color: #8f959e; }
.col .cb { padding: 8px; display: flex; flex-direction: column; gap: 7px; min-height: 60px; }
.tk {
  border: 1px solid #e5e6eb; border-radius: 5px; padding: 8px 9px; cursor: pointer; background: #fff;
}
.tk:hover { border-color: #3370ff; }
.tk .t1 { display: flex; gap: 5px; align-items: center; margin-bottom: 4px; }
.tk .t2 { font-size: 12px; line-height: 1.45; margin-bottom: 5px; }
.tk .t3 { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #8f959e; }
.tk .mv { margin-left: auto; color: #3370ff; }

/* ---------- 统计页 ---------- */
.sec { background: #fff; border: 1px solid #e5e6eb; border-radius: 6px; padding: 14px 16px; margin-bottom: 12px; }
.sec h3 { font-size: 13px; font-weight: 600; margin-bottom: 12px; }
.bar { display: grid; grid-template-columns: 74px 1fr 96px; gap: 10px; align-items: center; margin-bottom: 8px; font-size: 12px; }
.bar .tr { background: #f2f3f5; height: 16px; border-radius: 3px; overflow: hidden; position: relative; }
.bar .fl { height: 100%; background: #3370ff; border-radius: 3px; }
.bar .fl.over { background: #f54a45; }
.bar .cap { position: absolute; left: calc(100% - 2px); top: -2px; bottom: -2px; width: 2px; background: #4e5969; }
.bar .tx { text-align: right; color: #4e5969; font-variant-numeric: tabular-nums; }
.bar .tx b { color: #1f2329; }

/* ---------- 甘特图 ---------- */
.gwrap { background: #fff; border: 1px solid #e5e6eb; border-radius: 6px; overflow: auto; max-height: calc(100vh - 250px); }
.gwrap table { border-collapse: separate; border-spacing: 0; width: auto; min-width: 100%; }
.gwrap thead th { position: sticky; top: 0; z-index: 4; background: #f7f8fa; }
.gwrap .gside {
  position: sticky; left: 0; z-index: 3; background: #fff; width: 280px; min-width: 280px;
  max-width: 280px; text-align: left; font-weight: 400; color: #1f2329;
}
.gwrap thead .gside { z-index: 5; background: #f7f8fa; }
.gwrap .day {
  width: 34px; min-width: 34px; max-width: 34px; text-align: center; font-size: 11px;
  color: #8f959e; padding: 5px 0; border-left: 1px solid #eef0f3; line-height: 1.3;
}
.gwrap .day b { display: block; font-weight: 500; color: #4e5969; font-size: 11px; }
.gwrap .day.we, .gwrap td.cwe { background: #fafbfc; color: #c9cdd4; }
.gwrap .day.we b { color: #b7bcc4; }
.gwrap .day.td, .gwrap td.ctd { background: #fdeceb; }
.gwrap .day.td b { color: #d54941; }
.gwrap td.ctd { box-shadow: inset 2px 0 0 #f54a45; }
.gwrap td.cell { border-left: 1px solid #f5f6f8; padding: 0; }
.gwrap tr.grow td { border-bottom: 1px solid #f0f1f3; }
.gwrap tr.grow:hover td { background: #f7f9ff; }
.gwrap .gname {
  padding: 4px 10px; font-size: 12px; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; display: flex; align-items: center; gap: 6px;
}
.gwrap .gname .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gwrap .gname .d { margin-left: auto; color: #8f959e; font-size: 11px; flex: 0 0 auto; }
.gwrap tr.gh2 td {
  background: #f0f4ff; font-size: 12px; font-weight: 600; color: #245bdb;
  padding: 5px 10px; border-bottom: 1px solid #e5e6eb;
}
.gwrap .gbar {
  height: 17px; border-radius: 3px; margin: 3px 2px; position: relative;
  cursor: pointer; overflow: hidden;
}
.gwrap .gbar:hover { filter: brightness(1.08); }
.gwrap .gbar span {
  position: absolute; left: 6px; top: 0; line-height: 17px; font-size: 10px;
  color: #fff; white-space: nowrap; text-shadow: 0 0 3px rgba(0,0,0,.35);
}
.gwrap .gbar.done { opacity: .42; }
.gwrap .gbar.done span::after { content: " ✓"; }
.glegend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: #8f959e; margin-top: 8px; }
.glegend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.gtools { margin-bottom: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* ---------- 拖拽 ---------- */
.tk { cursor: grab; }
.tk:active { cursor: grabbing; }
.tk.dragging { opacity: .4; border-style: dashed; }
.col .cb.over { background: #f2f6ff; box-shadow: inset 0 0 0 1px #3370ff; border-radius: 5px; }
.dl { height: 2px; background: #3370ff; border-radius: 2px; margin: 2px 0; }

/* ---------- 表单 ---------- */
.fm { margin-bottom: 11px; }
.fm > label { display: block; font-size: 12px; color: #8f959e; margin-bottom: 4px; }
.fm input, .fm select, .fm textarea {
  width: 100%; border: 1px solid #d0d3d9; border-radius: 4px; padding: 5px 7px;
  font-size: 12px; font-family: inherit; color: #1f2329; background: #fff; outline: none;
}
.fm input:focus, .fm select:focus, .fm textarea:focus { border-color: #3370ff; }
.fm .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fm .three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.fm .req::after { content: " *"; color: #f54a45; }
.err { color: #f54a45; font-size: 12px; margin-bottom: 8px; }

/* ---------- 详情抽屉 ---------- */
.mask { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; z-index: 20; }
.mask.on { display: block; }
.dw {
  position: fixed; right: 0; top: 0; bottom: 0; width: 400px; background: #fff; z-index: 21;
  box-shadow: -2px 0 12px rgba(0,0,0,.12); transform: translateX(100%); transition: transform .18s;
  display: flex; flex-direction: column;
}
.dw.on { transform: translateX(0); }
.dw .dh { padding: 14px 18px; border-bottom: 1px solid #e5e6eb; display: flex; align-items: center; }
.dw .dh .tid { font-family: Consolas, monospace; color: #3370ff; font-size: 12px; }
.dw .dh .x { margin-left: auto; cursor: pointer; color: #8f959e; font-size: 18px; line-height: 1; }
.dw .db { padding: 16px 18px; overflow: auto; flex: 1; }
.dw .row2 { display: grid; grid-template-columns: 78px 1fr; gap: 10px; margin-bottom: 12px; font-size: 12px; }
.dw .row2 .k { color: #8f959e; }
.dw .row2 .v { line-height: 1.6; }
.dw .tt { font-size: 15px; font-weight: 600; margin-bottom: 14px; line-height: 1.5; }
.dw .acts { margin-top: 16px; display: flex; gap: 6px; flex-wrap: wrap; }
.empty { padding: 40px; text-align: center; color: #8f959e; }

</style>
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="logo">
      <div class="mark"></div>
      <div>
        <div class="pn">thatgamejam #02</div>
      </div>
    </div>
    <div class="grp">工作</div>
    <div class="item on" data-view="story">需求 <span class="cnt" id="cStory"></span></div>
    <div class="item" data-view="board">看板 <span class="cnt" id="cBoard"></span></div>
    <div class="item" data-view="gantt">甘特图</div>
    <div class="item" data-view="stats">统计报表</div>
    <div class="grp">按 Epic 筛选</div>
    <div id="epicNav"></div>
    <div class="foot">数据由 backlog-故事清单.csv 生成<br>状态 / 新增需求保存在本地浏览器</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1 id="vTitle">需求</h1>
      <span class="crumb" id="vCrumb"></span>
      <div class="right">
        <button class="btn pri" id="btnNew">+ 新建需求</button>
        <button class="btn" id="btnReset">重置状态</button>
        <button class="btn" id="btnExport">导出 CSV</button>
      </div>
    </header>

    <div class="content">
      <div class="stats" id="stats"></div>

      <div class="toolbar" id="toolbar">
        <label>迭代</label><select id="fSprint"></select>
        <label>优先级</label><select id="fPri"></select>
        <label>处理人</label><select id="fRole"></select>
        <label>状态</label><select id="fStatus"></select>
        <input type="text" id="fKw" placeholder="搜索标题 / ID">
        <span class="spacer"></span>
        <div class="seg" id="segGroup">
          <button data-g="none" class="on">不分组</button>
          <button data-g="epic">按 Epic</button>
          <button data-g="sprint">按迭代</button>
          <button data-g="role">按处理人</button>
        </div>
      </div>

      <div id="view"></div>
    </div>
  </main>
</div>

<div class="mask" id="mask"></div>
<div class="dw" id="dw">
  <div class="dh"><span class="tid" id="dId"></span><span class="x" id="dX">×</span></div>
  <div class="db" id="dBody"></div>
</div>

<script>
// 由 backlog-故事清单.csv 自动生成，请勿手改
const EPIC_NAME={"PREP":"准备与定型","MOVE":"移动层","SENSE":"感知层","DREAD":"危险层","ECHO":"回声定位","TORCH":"火把与人形","ART":"2D横版美术","WORLD":"关卡与地图","SHIP":"构建与提交","FEEL":"手感与数值"};
const SPRINTS={"S0":{"name":"S0 预备","start":"10/22","end":"10/23"},"S1":{"name":"S1 垂直切片","start":"10/24","end":"10/29"},"S2":{"name":"S2 内容量产","start":"10/30","end":"11/03"},"S3":{"name":"S3 打磨出包","start":"11/04","end":"11/07"}};
const ROLES=["程序","音频","美术A","美术B","策划"];

<script>
/* 声音即视野 · 项目管理看板
   数据来自 backlog-故事清单.csv（data.js）
   状态 / 处理人 / 备注 / 排序 / 日期 / 新建需求 的改动保存在浏览器 localStorage
*/

/* ---------- 常量 ---------- */
const EPIC_COLOR = {
  PREP: '#8f959e', MOVE: '#3370ff', SENSE: '#00a870', DREAD: '#f54a45', ECHO: '#9254de',
  TORCH: '#ff8800', ART: '#0fc6c2', WORLD: '#7cb305', SHIP: '#4e5969', FEEL: '#d97706'
};
const ROLE_AV = { '程序': '程', '音频': '音', '美术A': 'A', '美术B': 'B', '策划': '策' };
const ROLE_IDX = { '程序': 0, '音频': 1, '美术A': 2, '美术B': 3, '策划': 4 };
const GRAY_CLS = { '已': 'gy', '部分': 'gp', '未': 'gn' };

// 承诺容量（人天）：P0+P1 正好铺满；超出部分即 P2 缓冲池
const ROLE_CAP = { '程序': 16, '音频': 11.5, '美术A': 10.5, '美术B': 10, '策划': 12 };
// 迭代可用容量（5 人 × 有效工作日）：S0 2d / S1 4d / S2 5d / S3 4d
const SPRINT_CAP = { S0: 10, S1: 20, S2: 25, S3: 20 };

const LS_KEY = 'tgd02-board-v1';
const CUS_KEY = 'tgd02-custom-v1';
const BASE_YEAR = 2026;

/* ---------- 运行时状态 ---------- */
let ov = { st: {}, role: {}, note: {}, rank: {}, date: {} };
let custom = [];
let view = 'story';
let group = 'none';
let showP2 = true;
let dragId = null;
let curId = null;
let mode = 'view';           // view | new
let filter = { sprint: '', pri: '', role: '', status: '', kw: '', epic: '' };

try { ov = Object.assign(ov, JSON.parse(localStorage.getItem(LS_KEY) || '{}')); } catch (e) {}
try { custom = JSON.parse(localStorage.getItem(CUS_KEY) || '[]'); } catch (e) {}
const save = () => localStorage.setItem(LS_KEY, JSON.stringify(ov));
const saveCus = () => localStorage.setItem(CUS_KEY, JSON.stringify(custom));

const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const $ = id => document.getElementById(id);
const byId = id => STORIES.find(s => s.id === id);

/* ---------- 合并新建需求 ---------- */
custom.forEach(c => { if (!byId(c.id)) STORIES.push(c); });
STORIES.forEach((s, i) => { if (s.__i == null) s.__i = i; });

/* ---------- 派生 ---------- */
function eff(s) {
  return {
    ...s,
    status: ov.st[s.id] || 'Backlog',
    role: ov.role[s.id] || s.role,
    note: ov.note[s.id] || ''
  };
}
const ALL = () => STORIES.map(eff);

const rankOf = s => (ov.rank && ov.rank[s.id] != null ? ov.rank[s.id] : (s.__i || 0) * 1000);
const sorted = arr => arr.slice().sort((a, b) => rankOf(a) - rankOf(b));

function filtered() {
  const kw = filter.kw.trim().toLowerCase();
  return ALL().filter(s =>
    (!filter.sprint || s.sprint === filter.sprint) &&
    (!filter.pri || s.pri === filter.pri) &&
    (!filter.role || s.role === filter.role) &&
    (!filter.status || s.status === filter.status) &&
    (!filter.epic || s.epic === filter.epic) &&
    (!kw || s.title.toLowerCase().includes(kw) || s.id.toLowerCase().includes(kw) || s.feature.toLowerCase().includes(kw))
  );
}

/* ---------- 甘特时间轴 ---------- */
const pd = str => { const p = String(str).split('/'); return new Date(BASE_YEAR, +p[0] - 1, +p[1]); };
const GKEYS = Object.keys(SPRINTS);
const GSTART = new Date(Math.min.apply(null, GKEYS.map(k => pd(SPRINTS[k].start))));
const GEND = new Date(Math.max.apply(null, GKEYS.map(k => pd(SPRINTS[k].end))));
const NDAYS = Math.round((GEND - GSTART) / 864e5) + 1;
const WD = ['日', '一', '二', '三', '四', '五', '六'];
const dayAt = i => new Date(GSTART.getTime() + i * 864e5);
const isWe = i => { const d = dayAt(i).getDay(); return d === 0 || d === 6; };
const dlabel = i => { const d = dayAt(i); return (d.getMonth() + 1) + '/' + d.getDate(); };
let TODAY = -1;
(function () {
  const n = new Date(); n.setHours(0, 0, 0, 0);
  if (n >= GSTART && n <= GEND) TODAY = Math.round((n - GSTART) / 864e5);
})();

function rangeOf(s) {
  const c = ov.date && ov.date[s.id];
  if (c && c.s && c.e) { const a = pd(c.s), b = pd(c.e); if (a <= b) return { a: a, b: b }; }
  const sp = SPRINTS[s.sprint];
  if (!sp) return null;
  return { a: pd(sp.start), b: pd(sp.end) };
}
const rangeIdx = r => ({ ia: Math.round((r.a - GSTART) / 864e5), ib: Math.round((r.b - GSTART) / 864e5) });

/* ---------- 侧栏 ---------- */
function renderNav() {
  const list = filtered();
  $('cStory').textContent = list.length;
  $('cBoard').textContent = list.length;

  const total = {};
  STORIES.forEach(s => total[s.epic] = (total[s.epic] || 0) + 1);
  $('epicNav').innerHTML = Object.keys(EPIC_NAME).map(k => {
    const on = filter.epic === k ? ' on' : '';
    return '<div class="item' + on + '" data-epic="' + k + '">' +
      '<span class="dot" style="background:' + EPIC_COLOR[k] + '"></span>' +
      '<span>' + EPIC_NAME[k] + '</span>' +
      '<span class="cnt">' + total[k] + '</span></div>';
  }).join('');
  $('epicNav').querySelectorAll('[data-epic]').forEach(el => {
    el.onclick = () => { filter.epic = (filter.epic === el.dataset.epic ? '' : el.dataset.epic); renderAll(); };
  });
}

/* ---------- 顶部统计卡 ---------- */
function renderStats() {
  const list = filtered();
  const all = ALL();
  const days = list.reduce((a, s) => a + s.days, 0);
  const d01 = list.filter(s => s.pri !== 'P2').reduce((a, s) => a + s.days, 0);
  const done = all.filter(s => s.status === '完成');
  const doneD = done.reduce((a, s) => a + s.days, 0);
  const allD = all.reduce((a, s) => a + s.days, 0);
  const pct = allD ? Math.round(doneD / allD * 100) : 0;

  const cards = [
    { k: 'Story 总数', v: list.length + '<small> / ' + STORIES.length + '</small>' },
    { k: '工作量（人天）', v: days.toFixed(1), warn: days > 60 },
    { k: 'P0 + P1 承诺量', v: d01.toFixed(1) + '<small> / 60</small>', cls: d01 > 60 ? 'warn' : 'ok' },
    { k: '已完成', v: done.length + '<small> 条 · ' + doneD.toFixed(1) + ' 人天</small>' },
    { k: '整体进度', v: pct + '<small>%</small>' }
  ];
  $('stats').innerHTML = cards.map(c =>
    '<div class="card ' + (c.cls || (c.warn ? 'warn' : '')) + '"><div class="k">' + c.k + '</div><div class="v">' + c.v + '</div></div>'
  ).join('');
}

/* ---------- 主视图 ---------- */
function renderView() {
  if (view === 'story') renderTable();
  else if (view === 'board') renderBoard();
  else if (view === 'gantt') renderGantt();
  else renderStatsView();
}

const GROUPS = {
  none: null,
  epic: { key: s => s.epic, label: k => EPIC_NAME[k] + ' <span class="n">' + k + '</span>' },
  sprint: { key: s => s.sprint, label: k => (SPRINTS[k] ? SPRINTS[k].name : k) + ' <span class="n">' + (SPRINTS[k] ? SPRINTS[k].start + '–' + SPRINTS[k].end : '') + '</span>' },
  role: { key: s => s.role, label: k => k }
};

function grouped(list, g) {
  if (!g) return [{ label: null, arr: list }];
  const buckets = {}, order = [];
  list.forEach(s => { const k = g.key(s); if (!buckets[k]) { buckets[k] = []; order.push(k); } buckets[k].push(s); });
  return order.map(k => ({ label: g.label(k), arr: buckets[k] }));
}

function renderTable() {
  const list = sorted(filtered());
  const g = GROUPS[group];
  let html = '<div class="tw"><table><thead><tr>' +
    '<th>ID</th><th>标题</th><th>Epic</th><th>Feature</th><th>优先级</th><th>灰盒</th>' +
    '<th style="text-align:right">人天</th><th>迭代</th><th>处理人</th><th>状态</th><th>依赖</th>' +
    '</tr></thead><tbody>';

  grouped(list, g).forEach(b => {
    if (b.label) {
      const d = b.arr.reduce((a, s) => a + s.days, 0);
      html += '<tr><td class="gh" colspan="11">' + b.label + ' <span class="n">' + b.arr.length + ' 条 · ' + d.toFixed(1) + ' 人天</span></td></tr>';
    }
    html += b.arr.map(rowTr).join('');
  });
  if (!list.length) html += '<tr><td colspan="11"><div class="empty">没有符合条件的Story</div></td></tr>';
  html += '</tbody></table></div>';
  $('view').innerHTML = html;
  $('view').querySelectorAll('td.id').forEach(td => td.onclick = () => openDw(td.dataset.id));
  $('view').querySelectorAll('.st').forEach(el => el.onclick = e => { e.stopPropagation(); cycleStatus(el.dataset.id); });
}

function rowTr(s) {
  const st = STATUSES.indexOf(s.status);
  return '<tr class="' + (s.status === '完成' ? 'done' : '') + '">' +
    '<td class="id" data-id="' + s.id + '">' + s.id + '</td>' +
    '<td class="title">' + esc(s.title) + '</td>' +
    '<td><span class="tag ep" style="background:' + EPIC_COLOR[s.epic] + '22;color:' + EPIC_COLOR[s.epic] + '">' + esc(s.epicName) + '</span></td>' +
    '<td style="color:#8f959e">' + esc(s.feature) + '</td>' +
    '<td><span class="tag ' + s.pri.toLowerCase() + '">' + s.pri + '</span></td>' +
    '<td><span class="tag ' + (GRAY_CLS[s.gray] || 'gn') + '">' + esc(s.gray) + '</span></td>' +
    '<td class="num">' + s.days.toFixed(1) + '</td>' +
    '<td><span class="tag p2">' + s.sprint + '</span></td>' +
    '<td><span class="av r' + ROLE_IDX[s.role] + '">' + ROLE_AV[s.role] + '</span>' + s.role + '</td>' +
    '<td><span class="st s' + st + '" data-id="' + s.id + '"><span class="d"></span>' + s.status + '</span></td>' +
    '<td style="color:#8f959e">' + esc(s.dep || '—') + '</td>' +
    '</tr>';
}

function cycleStatus(id) {
  const i = STATUSES.indexOf(ov.st[id] || 'Backlog');
  ov.st[id] = STATUSES[(i + 1) % STATUSES.length];
  save(); renderAll();
}
function moveStatus(id, dir) {
  const i = STATUSES.indexOf(ov.st[id] || 'Backlog');
  ov.st[id] = STATUSES[Math.min(STATUSES.length - 1, Math.max(0, i + dir))];
  save(); renderAll();
}

/* ---------- 看板（支持拖拽） ---------- */
const ST_COLOR = ['#c9cdd4', '#3370ff', '#ff8800', '#9254de', '#00a870'];

function renderBoard() {
  const list = filtered();
  let html = '<div class="board">';
  STATUSES.forEach((st, i) => {
    const arr = sorted(list.filter(s => s.status === st));
    const d = arr.reduce((a, s) => a + s.days, 0);
    html += '<div class="col"><div class="ch"><span style="width:7px;height:7px;border-radius:50%;background:' + ST_COLOR[i] + '"></span>' + st +
      '<span class="n">' + arr.length + ' 条 · ' + d.toFixed(1) + '人天</span></div>' +
      '<div class="cb" data-st="' + st + '">';
    html += arr.map(s =>
      '<div class="tk" data-id="' + s.id + '" draggable="true">' +
      '<div class="t1"><span class="tag ' + s.pri.toLowerCase() + '">' + s.pri + '</span>' +
      '<span class="tag ep" style="background:' + EPIC_COLOR[s.epic] + '22;color:' + EPIC_COLOR[s.epic] + '">' + s.id + '</span></div>' +
      '<div class="t2">' + esc(s.title) + '</div>' +
      '<div class="t3"><span class="av r' + ROLE_IDX[s.role] + '">' + ROLE_AV[s.role] + '</span>' + s.days.toFixed(1) + 'd' +
      '<span class="mv" data-mv="-1" data-id="' + s.id + '">←</span>' +
      '<span class="mv" data-mv="1" data-id="' + s.id + '">→</span></div></div>'
    ).join('');
    if (!arr.length) html += '<div style="color:#c9cdd4;font-size:12px;padding:10px 4px">拖卡片到这里</div>';
    html += '</div></div>';
  });
  html += '</div>';
  $('view').innerHTML = html;

  $('view').querySelectorAll('.tk').forEach(el => {
    el.addEventListener('dragstart', e => {
      dragId = el.dataset.id;
      e.dataTransfer.setData('text/plain', el.dataset.id);
      e.dataTransfer.effectAllowed = 'move';
      el.classList.add('dragging');
    });
    el.addEventListener('dragend', () => { el.classList.remove('dragging'); clearLine(); });
    el.onclick = e => {
      if (e.target.dataset.mv) { e.stopPropagation(); moveStatus(e.target.dataset.id, parseInt(e.target.dataset.mv, 10)); return; }
      openDw(el.dataset.id);
    };
  });

  $('view').querySelectorAll('.cb').forEach(cb => {
    cb.addEventListener('dragover', e => {
      e.preventDefault(); e.dataTransfer.dropEffect = 'move';
      showLine(cb, e.clientY); cb.classList.add('over');
    });
    cb.addEventListener('dragleave', e => { if (!cb.contains(e.relatedTarget)) { cb.classList.remove('over'); clearLine(); } });
    cb.addEventListener('drop', e => {
      e.preventDefault(); cb.classList.remove('over'); clearLine();
      dropTo(cb.dataset.st, cb, e.clientY);
    });
  });
}

/* 插入指示线 */
function clearLine() { const l = document.querySelector('.dl'); if (l) l.remove(); document.querySelectorAll('.cb.over').forEach(c => c.classList.remove('over')); }
function showLine(cb, y) {
  clearLine();
  const cards = [...cb.querySelectorAll('.tk')].filter(c => c.dataset.id !== dragId);
  let target = null;
  for (const c of cards) { const r = c.getBoundingClientRect(); if (y < r.top + r.height / 2) { target = c; break; } }
  const line = document.createElement('div'); line.className = 'dl';
  if (target) cb.insertBefore(line, target); else cb.appendChild(line);
}
function dropTo(status, cb, y) {
  if (!dragId) return;
  const cards = [...cb.querySelectorAll('.tk')].filter(c => c.dataset.id !== dragId);
  let before = null, after = null;
  for (const c of cards) { const r = c.getBoundingClientRect(); if (y < r.top + r.height / 2) { after = c; break; } before = c; }
  let nr;
  if (before && after) {
    const s1 = byId(before.dataset.id), s2 = byId(after.dataset.id);
    nr = (rankOf(eff(s1)) + rankOf(eff(s2))) / 2;
  } else if (after) {
    nr = rankOf(eff(byId(after.dataset.id))) - 500;
  } else if (before) {
    nr = rankOf(eff(byId(before.dataset.id))) + 500;
  } else {
    nr = 0;
  }
  ov.st[dragId] = status;
  ov.rank[dragId] = nr;
  save();
  dragId = null;
  renderAll();
}

/* ---------- 甘特图 ---------- */
function renderGantt() {
  const g = group === 'sprint' ? null : GROUPS[group];
  let list = filtered();
  if (!showP2) list = list.filter(s => s.pri !== 'P2');
  list = sorted(list).sort((a, b) => {
    const ra = rangeOf(a), rb2 = rangeOf(b);
    const ia = ra ? rangeIdx(ra).ia : 999, ib = rb2 ? rangeIdx(rb2).ia : 999;
    return ia - ib || rankOf(a) - rankOf(b);
  });

  let html = '<div class="gtools">' +
    '<div class="seg" id="segG">' +
    ['none:不分组', 'epic:按 Epic', 'role:按处理人'].map(o => {
      const [v, t] = o.split(':');
      return '<button data-g="' + v + '" class="' + ((group === 'sprint' ? 'none' : group) === v ? 'on' : '') + '">' + t + '</button>';
    }).join('') + '</div>' +
    '<label style="font-size:12px;color:#8f959e;display:flex;align-items:center;gap:5px">' +
    '<input type="checkbox" id="ckP2"' + (showP2 ? ' checked' : '') + '> 显示 P2 缓冲</label>' +
    '<span style="font-size:12px;color:#8f959e">条 = 迭代区间（详情里可改起止日期）· 点击条打开详情 · 卡片可在看板里拖拽</span>' +
    '</div>';

  html += '<div class="gwrap"><table><thead><tr><th class="gside">需求</th>';
  for (let i = 0; i < NDAYS; i++) {
    html += '<th class="day' + (isWe(i) ? ' we' : '') + (i === TODAY ? ' td' : '') + '"><b>' + dlabel(i) + '</b>' + WD[dayAt(i).getDay()] + '</th>';
  }
  html += '</tr></thead><tbody>';

  grouped(list, g).forEach(b => {
    if (b.label) {
      const d = b.arr.reduce((a, s) => a + s.days, 0);
      html += '<tr class="gh2"><td colspan="' + (NDAYS + 1) + '">' + b.label + ' <span class="n" style="font-weight:400;color:#8f959e">' + b.arr.length + ' 条 · ' + d.toFixed(1) + ' 人天</span></td></tr>';
    }
    b.arr.forEach(s => { html += ganttRow(s); });
  });

  if (!list.length) html += '<tr><td colspan="' + (NDAYS + 1) + '"><div class="empty">没有符合条件的Story</div></td></tr>';
  html += '</tbody></table></div>';

  html += '<div class="glegend">' + Object.keys(EPIC_NAME).map(k =>
    '<span><i style="background:' + EPIC_COLOR[k] + '"></i>' + EPIC_NAME[k] + '</span>').join('') +
    '<span><i style="background:#f54a45"></i>今天</span></div>';

  $('view').innerHTML = html;
  $('view').querySelectorAll('.gbar').forEach(el => el.onclick = () => openDw(el.dataset.id));
  $('view').querySelectorAll('#segG button').forEach(b => b.onclick = () => { group = b.dataset.g; renderGantt(); });
  const ck = $('ckP2'); if (ck) ck.onchange = () => { showP2 = ck.checked; renderGantt(); };
}

function ganttRow(s) {
  const r = rangeOf(s);
  let cells = '';
  let ia = -1, ib = -2;
  if (r) { const x = rangeIdx(r); ia = Math.max(0, x.ia); ib = Math.min(NDAYS - 1, x.ib); }
  for (let i = 0; i < NDAYS; i++) {
    const cls = 'cell' + (isWe(i) ? ' cwe' : '') + (i === TODAY ? ' ctd' : '');
    if (i >= ia && i <= ib) {
      if (i === ia) {
        const span = ib - ia + 1;
        cells += '<td class="' + cls + '" colspan="' + span + '">' +
          '<div class="gbar' + (s.status === '完成' ? ' done' : '') + '" data-id="' + s.id + '"' +
          ' style="background:' + EPIC_COLOR[s.epic] + '"' +
          ' title="' + esc(s.id + ' · ' + s.title + ' · ' + s.days.toFixed(1) + '人天 · ' + s.role) + '">' +
          '<span>' + s.days.toFixed(1) + 'd ' + esc(s.title) + '</span></div></td>';
      }
      continue;
    }
    cells += '<td class="' + cls + '"></td>';
  }
  return '<tr class="grow"><td class="gside"><div class="gname">' +
    '<span class="av r' + ROLE_IDX[s.role] + '">' + ROLE_AV[s.role] + '</span>' +
    '<span class="t">' + esc(s.title) + '</span>' +
    '<span class="d">' + s.days.toFixed(1) + 'd</span></div></td>' + cells + '</tr>';
}

/* ---------- 统计报表 ---------- */
function bar(label, p01, total, cap) {
  const max = Math.max(total, cap || 0, 0.1);
  const over = cap != null && total > cap + 0.001;
  const base = over ? '#fbdcda' : '#dbe6ff';
  const inner = over && p01 > cap ? '#f54a45' : '#3370ff';
  const innerW = total ? (p01 / total * 100) : 0;
  return '<div class="bar"><div>' + label + '</div>' +
    '<div class="tr"><div class="fl" style="width:' + (total / max * 100) + '%;background:' + base + '">' +
    '<div style="height:100%;width:' + innerW + '%;background:' + inner + '"></div></div>' +
    (cap != null ? '<div class="cap" style="left:' + (cap / max * 100) + '%"></div>' : '') + '</div>' +
    '<div class="tx"><b>' + total.toFixed(1) + '</b>' + (cap != null ? ' / ' + cap.toFixed(1) : '') + '</div></div>';
}

function renderStatsView() {
  const all = ALL();
  const sum = (arr, f) => arr.filter(f || (() => true)).reduce((a, s) => a + s.days, 0);

  let roleHtml = '';
  ROLES.forEach(r => {
    const arr = all.filter(s => s.role === r);
    roleHtml += bar(r, sum(arr, s => s.pri !== 'P2'), sum(arr), ROLE_CAP[r]);
  });
  const roleDone = ROLES.map(r => r + ' 已完成 ' + sum(all.filter(s => s.role === r && s.status === '完成')).toFixed(1)).join(' ／ ');

  let spHtml = '';
  Object.keys(SPRINTS).forEach(k => {
    const arr = all.filter(s => s.sprint === k);
    spHtml += bar(SPRINTS[k].name + ' <span style="color:#8f959e">' + SPRINTS[k].start + '–' + SPRINTS[k].end + '</span>',
      sum(arr, s => s.pri !== 'P2'), sum(arr), SPRINT_CAP[k]);
  });

  let epHtml = '';
  Object.keys(EPIC_NAME).forEach(k => {
    const arr = all.filter(s => s.epic === k);
    epHtml += bar(EPIC_NAME[k], sum(arr, s => s.pri !== 'P2'), sum(arr), null);
  });

  let priHtml = '';
  ['P0', 'P1', 'P2'].forEach(p => {
    const arr = all.filter(s => s.pri === p);
    priHtml += bar('<span class="tag ' + p.toLowerCase() + '">' + p + '</span>', sum(arr), sum(arr), null);
  });

  let stHtml = '';
  STATUSES.forEach(st => {
    const arr = all.filter(s => s.status === st);
    stHtml += bar(st, sum(arr), sum(arr), null);
  });

  $('view').innerHTML =
    '<div class="sec"><h3>按处理人 · 负载 vs 承诺容量<span style="font-weight:400;color:#8f959e;font-size:12px">（深色=P0/P1 承诺量，浅色=P2 缓冲；竖线=容量）</span></h3>' +
    roleHtml + '<div style="font-size:12px;color:#8f959e;margin-top:6px">' + roleDone + '</div></div>' +
    '<div class="sec"><h3>按迭代 · 负载 vs 可用容量</h3>' + spHtml +
    '<div style="font-size:12px;color:#8f959e;margin-top:6px">S2 / S3 超出部分全部是 P2 缓冲池，时间不够就从 P2 往下砍。</div></div>' +
    '<div class="sec"><h3>按 Epic · 工作量分布</h3>' + epHtml + '</div>' +
    '<div class="sec"><h3>按优先级</h3>' + priHtml + '</div>' +
    '<div class="sec"><h3>按状态</h3>' + stHtml + '</div>';
}

/* ---------- 详情抽屉 ---------- */
function openDw(id) {
  const s = byId(id); if (!s) return;
  curId = id; mode = 'view';
  const e = eff(s);
  const d = (ov.date && ov.date[id]) || { s: '', e: '' };
  $('dId').textContent = s.id;

  const rows = [
    ['Epic', '<span class="tag ep" style="background:' + EPIC_COLOR[s.epic] + '22;color:' + EPIC_COLOR[s.epic] + '">' + esc(s.epicName) + '</span> <span style="color:#8f959e">' + s.epic + '</span>'],
    ['Feature', esc(s.feature)],
    ['优先级', '<span class="tag ' + s.pri.toLowerCase() + '">' + s.pri + '</span>'],
    ['灰盒状态', '<span class="tag ' + (GRAY_CLS[s.gray] || 'gn') + '">' + esc(s.gray) + '</span>'],
    ['工作量', '原估算 ' + s.raw.toFixed(1) + ' 人天 → 实际 <b>' + s.days.toFixed(1) + '</b> 人天'],
    ['迭代', (SPRINTS[s.sprint] ? SPRINTS[s.sprint].name : s.sprint) + ' <span style="color:#8f959e">' + (SPRINTS[s.sprint] ? SPRINTS[s.sprint].start + '–' + SPRINTS[s.sprint].end : '') + '</span>'],
    ['处理人', '<span class="av r' + ROLE_IDX[e.role] + '">' + ROLE_AV[e.role] + '</span>' + e.role],
    ['依赖', esc(s.dep || '—')]
  ];

  $('dBody').innerHTML =
    '<div class="tt">' + esc(s.title) + '</div>' +
    rows.map(r => '<div class="row2"><div class="k">' + r[0] + '</div><div class="v">' + r[1] + '</div></div>').join('') +
    '<div class="row2"><div class="k">状态</div><div class="v" id="dSt"></div></div>' +
    '<div class="row2"><div class="k">改处理人</div><div class="v" id="dRole"></div></div>' +
    '<div class="fm"><label>甘特起止日期（留空 = 跟随迭代）</label>' +
    '<div class="two"><input type="text" id="dS" placeholder="如 10/24" value="' + esc(d.s) + '">' +
    '<input type="text" id="dE" placeholder="如 10/29" value="' + esc(d.e) + '"></div></div>' +
    '<div class="fm"><label>备注</label><textarea id="dNote" rows="4">' + esc(e.note) + '</textarea></div>' +
    '<div class="acts"><button class="btn" id="dDel">清除自定义状态</button>' +
    (custom.find(c => c.id === id) ? '<button class="btn" id="dRm" style="color:#f54a45;border-color:#f7c1bf">删除此需求</button>' : '') +
    '</div>';

  $('dSt').innerHTML = STATUSES.map(st =>
    '<button class="btn" data-st="' + st + '" style="' + (e.status === st ? 'background:#3370ff;border-color:#3370ff;color:#fff' : '') + ';margin-right:4px;margin-bottom:4px">' + st + '</button>'
  ).join('');
  $('dSt').querySelectorAll('[data-st]').forEach(b => b.onclick = () => { ov.st[id] = b.dataset.st; save(); openDw(id); renderAll(); });

  $('dRole').innerHTML = ROLES.map(r =>
    '<button class="btn" data-role="' + r + '" style="' + (e.role === r ? 'background:#3370ff;border-color:#3370ff;color:#fff' : '') + ';margin-right:4px;margin-bottom:4px">' + r + '</button>'
  ).join('');
  $('dRole').querySelectorAll('[data-role]').forEach(b => b.onclick = () => { ov.role[id] = b.dataset.role; save(); openDw(id); renderAll(); });

  $('dNote').oninput = ev => { ov.note[id] = ev.target.value; save(); };
  $('dS').oninput = ev => { setDate(id, ev.target.value, $('dE').value); };
  $('dE').oninput = ev => { setDate(id, $('dS').value, ev.target.value); };
  $('dDel').onclick = () => {
    delete ov.st[id]; delete ov.role[id]; delete ov.note[id]; delete ov.rank[id]; delete ov.date[id];
    save(); openDw(id); renderAll();
  };
  const rm = $('dRm');
  if (rm) rm.onclick = () => { if (confirm('删除需求 ' + id + '？')) removeStory(id); };

  $('mask').classList.add('on'); $('dw').classList.add('on');
}
function setDate(id, a, b) {
  if (!a && !b) { delete ov.date[id]; }
  else { ov.date[id] = { s: a, e: b }; }
  save();
  if (view === 'gantt') renderGantt();
}
function closeDw() { $('mask').classList.remove('on'); $('dw').classList.remove('on'); curId = null; mode = 'view'; }

/* ---------- 新建 / 删除需求 ---------- */
function autoId(epic) {
  let mx = 0;
  STORIES.forEach(s => { if (s.epic === epic) { const m = /(\d+)\s*$/.exec(s.id); if (m) mx = Math.max(mx, +m[1]); } });
  return epic + '-' + String(mx + 1).padStart(2, '0');
}
function featuresOf(epic) {
  return [...new Set(STORIES.filter(s => s.epic === epic).map(s => s.feature))].sort();
}

function openNew() {
  mode = 'new'; curId = null;
  $('dId').textContent = '新建需求';
  const f0 = featuresOf('PREP');
  $('dBody').innerHTML =
    '<div class="fm"><label class="req">标题</label><input type="text" id="nTitle" placeholder="例如：敌人接触时的光被吞没演出"></div>' +
    '<div class="fm two"><div><label>Epic</label><select id="nEpic">' +
    Object.keys(EPIC_NAME).map(k => '<option value="' + k + '">' + EPIC_NAME[k] + '（' + k + '）</option>').join('') +
    '</select></div><div><label>Story ID（留空自动生成）</label><input type="text" id="nId" placeholder="自动生成"></div></div>' +
    '<div class="fm"><label>Feature</label><input type="text" id="nFeat" list="nFeatList" placeholder="可填已有或新建">' +
    '<datalist id="nFeatList">' + f0.map(f => '<option value="' + esc(f) + '">').join('') + '</datalist></div>' +
    '<div class="fm three"><div><label>优先级</label><select id="nPri">' +
    ['P0', 'P1', 'P2'].map(p => '<option value="' + p + '"' + (p === 'P1' ? ' selected' : '') + '>' + p + '</option>').join('') + '</select></div>' +
    '<div><label>迭代</label><select id="nSprint">' + Object.keys(SPRINTS).map(k => '<option value="' + k + '">' + SPRINTS[k].name + '</option>').join('') + '</select></div>' +
    '<div><label>处理人</label><select id="nRole">' + ROLES.map(r => '<option value="' + r + '">' + r + '</option>').join('') + '</select></div></div>' +
    '<div class="fm three"><div><label>实际人天</label><input type="number" id="nDays" step="0.5" min="0" value="1"></div>' +
    '<div><label>原估算</label><input type="number" id="nRaw" step="0.5" min="0" value="1"></div>' +
    '<div><label>灰盒状态</label><select id="nGray">' + ['未', '部分', '已'].map(g => '<option value="' + g + '">' + g + '</option>').join('') + '</select></div></div>' +
    '<div class="fm two"><div><label>甘特开始（留空=跟随迭代）</label><input type="text" id="nS" placeholder="如 10/30"></div>' +
    '<div><label>甘特结束</label><input type="text" id="nE" placeholder="如 11/03"></div></div>' +
    '<div class="fm two"><div><label>状态</label><select id="nStatus">' + STATUSES.map(s => '<option value="' + s + '">' + s + '</option>').join('') + '</select></div>' +
    '<div><label>依赖</label><input type="text" id="nDep" placeholder="如 MOVE-02"></div></div>' +
    '<div class="fm"><label>备注</label><textarea id="nNote" rows="3"></textarea></div>' +
    '<div class="err" id="nErr"></div>' +
    '<div class="acts"><button class="btn pri" id="nSave">创建</button><button class="btn" id="nCancel">取消</button></div>';

  $('nEpic').onchange = () => {
    const dl = $('nFeatList');
    dl.innerHTML = featuresOf($('nEpic').value).map(f => '<option value="' + esc(f) + '">').join('');
  };
  $('nSave').onclick = saveNew;
  $('nCancel').onclick = closeDw;
  $('mask').classList.add('on'); $('dw').classList.add('on');
  setTimeout(() => $('nTitle').focus(), 30);
}

function saveNew() {
  const title = $('nTitle').value.trim();
  if (!title) { $('nErr').textContent = '标题不能为空'; $('nTitle').focus(); return; }
  const epic = $('nEpic').value;
  let id = $('nId').value.trim() || autoId(epic);
  if (byId(id)) { $('nErr').textContent = 'ID「' + id + '」已存在'; return; }
  const days = parseFloat($('nDays').value) || 0;
  const raw = parseFloat($('nRaw').value) || days;
  const st = {
    id: id, epic: epic, epicName: EPIC_NAME[epic],
    title: title, feature: $('nFeat').value.trim() || '（未分类）',
    raw: raw, gray: $('nGray').value, days: days,
    pri: $('nPri').value, sprint: $('nSprint').value, role: $('nRole').value,
    dep: $('nDep').value.trim(), __i: STORIES.length
  };
  STORIES.push(st);
  custom.push(st);
  saveCus();
  ov.st[id] = $('nStatus').value;
  if ($('nNote').value.trim()) ov.note[id] = $('nNote').value.trim();
  if ($('nS').value.trim() || $('nE').value.trim()) ov.date[id] = { s: $('nS').value.trim(), e: $('nE').value.trim() };
  save();
  closeDw();
  filter.epic = ''; filter.pri = ''; filter.status = ''; filter.sprint = ''; filter.kw = '';
  $('fSprint').value = ''; $('fPri').value = ''; $('fStatus').value = ''; $('fKw').value = '';
  renderAll();
  openDw(id);
}

function removeStory(id) {
  const i = STORIES.findIndex(s => s.id === id);
  if (i >= 0) STORIES.splice(i, 1);
  const j = custom.findIndex(c => c.id === id);
  if (j >= 0) custom.splice(j, 1);
  saveCus();
  ['st', 'role', 'note', 'rank', 'date'].forEach(k => { if (ov[k]) delete ov[k][id]; });
  save();
  closeDw(); renderAll();
}

/* ---------- 导出 ---------- */
function exportCsv() {
  const list = sorted(filtered());
  const head = ['Epic', 'Story ID', 'Story', 'Feature', '原估算', '灰盒状态', '实际人天', '优先级', 'Sprint', '角色', '依赖', '状态', '开始', '结束', '备注'];
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const lines = [head.map(q).join(',')].concat(list.map(s => {
    const d = (ov.date && ov.date[s.id]) || { s: '', e: '' };
    return [s.epic, s.id, s.title, s.feature, s.raw, s.gray, s.days, s.pri, s.sprint, s.role, s.dep, s.status, d.s, d.e, s.note].map(q).join(',');
  }));
  const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tapd-board-导出.csv';
  a.click(); URL.revokeObjectURL(a.href);
}

/* ---------- 初始化 ---------- */
function renderAll() { renderNav(); renderStats(); renderView(); }
function fillSel(el, pairs) {
  el.innerHTML = '<option value="">全部</option>' + pairs.map(p => '<option value="' + p[0] + '">' + p[1] + '</option>').join('');
}

(function init() {
  fillSel($('fSprint'), Object.keys(SPRINTS).map(k => [k, SPRINTS[k].name]));
  fillSel($('fPri'), [['P0', 'P0 必须有'], ['P1', 'P1 才完整'], ['P2', 'P2 有余力']]);
  fillSel($('fRole'), ROLES.map(r => [r, r]));
  fillSel($('fStatus'), STATUSES.map(s => [s, s]));

  const bind = (el, key) => el.addEventListener('change', () => { filter[key] = el.value; renderAll(); });
  bind($('fSprint'), 'sprint'); bind($('fPri'), 'pri'); bind($('fRole'), 'role'); bind($('fStatus'), 'status');
  $('fKw').addEventListener('input', () => { filter.kw = $('fKw').value; renderAll(); });

  const TITLES = { story: '需求', board: '看板', gantt: '甘特图', stats: '统计报表' };
  const CRUMBS = {
    story: '全部 Story · 点击 ID 打开详情',
    board: '按状态分列 · 直接拖拽卡片 · ← → 也可移动',
    gantt: '时间轴 ' + dlabel(0) + ' – ' + dlabel(NDAYS - 1) + ' · 条 = 迭代区间',
    stats: '容量与负载'
  };

  $('segGroup').querySelectorAll('button').forEach(b => b.onclick = () => {
    group = b.dataset.g;
    $('segGroup').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    renderView();
  });

  document.querySelectorAll('.side .item[data-view]').forEach(el => el.onclick = () => {
    view = el.dataset.view;
    document.querySelectorAll('.side .item[data-view]').forEach(x => x.classList.toggle('on', x === el));
    $('vTitle').textContent = TITLES[view];
    $('vCrumb').textContent = CRUMBS[view];
    $('toolbar').style.display = (view === 'stats' || view === 'gantt') ? 'none' : 'flex';
    renderView();
  });

  $('btnNew').onclick = openNew;
  $('btnExport').onclick = exportCsv;
  $('btnReset').onclick = () => {
    if (!confirm('清除所有本地改动（状态 / 处理人 / 排序 / 日期 / 备注）？\n新建的需求不会被删除。')) return;
    ov = { st: {}, role: {}, note: {}, rank: {}, date: {} }; save(); renderAll();
  };
  $('dX').onclick = closeDw;
  $('mask').onclick = closeDw;
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDw(); });

  $('vCrumb').textContent = CRUMBS.story;
  renderAll();
})();

</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>声音即视野 · 项目管理</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="logo">
      <div class="mark"></div>
      <div>
        <div class="pn">thatgamejam #02</div>
      </div>
    </div>
    <div class="grp">工作</div>
    <div class="item on" data-view="story">需求 <span class="cnt" id="cStory"></span></div>
    <div class="item" data-view="board">看板 <span class="cnt" id="cBoard"></span></div>
    <div class="item" data-view="gantt">甘特图</div>
    <div class="item" data-view="stats">统计报表</div>
    <div class="grp">其他</div>
    <div class="item" data-view="trash">回收站 <span class="cnt" id="cTrash"></span></div>
    <div class="foot">数据由 backlog-故事清单.csv 生成<br>状态 / 新增需求保存在本地浏览器</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1 id="vTitle">需求</h1>
      <span class="crumb" id="vCrumb"></span>
      <div class="right">
        <button class="btn pri" id="btnNew">+ 新建需求</button>
        <button class="btn" id="btnReset">重置状态</button>
        <button class="btn" id="btnExport">导出 CSV</button>
      </div>
    </header>

    <div class="content">
      <div class="stats" id="stats"></div>

      <div class="toolbar" id="toolbar">
        <label>Epic</label><select id="fEpic"></select>
        <label>迭代</label><select id="fSprint"></select>
        <label>优先级</label><select id="fPri"></select>
        <label>处理人</label><select id="fRole"></select>
        <label>状态</label><select id="fStatus"></select>
        <input type="text" id="fKw" placeholder="搜索标题 / ID">
        <span class="spacer"></span>
      </div>

      <div id="view"></div>
    </div>
  </main>
</div>

<div class="mask" id="mask"></div>
<div class="dw" id="dw">
  <div class="dh"><span class="tid" id="dId"></span><span class="x" id="dX">×</span></div>
  <div class="db" id="dBody"></div>
</div>

<script src="data.js" charset="utf-8"></script>
<script src="app.js" charset="utf-8"></script>
</body>
</html>
